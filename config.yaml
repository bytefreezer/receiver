# ByteFreezer Receiver Configuration — Docker-ready defaults
#
# This config ships inside the Docker image. Secrets (S3 credentials,
# control API key) are empty and MUST be supplied via environment variables
# or a volume-mounted config file override.

app:
  name: "bytefreezer-receiver"
  version: "1.0.0"

logging:
  level: "info"
  encoding: "console"

server:
  api_port: 8081

# Raw data ingestion
protocols:
  webhook:
    enabled: true
    port: 8080
    max_payload_size: 10485760  # 10MB
  upload:
    enabled: false
    max_file_size: 104857600  # 100MB

bytefreezer:
  upload_worker_count: 10
  spool_path: "/var/spool/bytefreezer-receiver"

# Control Service configuration
control_service:
  enabled: true
  control_url: ""
  api_key: ""
  account_id: ""
  timeout_seconds: 30

authentication:
  enabled: false

# OpenTelemetry configuration
otel:
  enabled: false
  service_name: "bytefreezer-receiver"
  scrapeIntervalseconds: 15
  prometheus_mode: true
  metrics_port: 9091
  metrics_host: "0.0.0.0"

housekeeping:
  enabled: true
  interval_seconds: 300

# S3 destination for raw webhook data
s3destination:
  bucket_name: "intake"
  region: "us-east-1"
  endpoint: "minio:9000"
  ssl: false
  access_key: ""
  secret_key: ""
  use_iam_role: false

soc:
  enabled: false

# Dead Letter Queue
dlq:
  enabled: true
  directory: "/var/spool/bytefreezer-receiver"
  retry_attempts: 3
  retry_interval_seconds: 60
  cleanup_interval_seconds: 300
  max_age_days: 7

dev: false

# Health reporting to control plane
health_reporting:
  enabled: true
  report_interval: 30
  timeout_seconds: 10
  register_on_startup: true

# Error tracking
error_tracking:
  enabled: true

# ByteFreezer Receiver Configuration — AWX/Ansible deployment
#
# This file contains AWX placeholder values for systemd/Ansible deployments.
# Ansible replaces REPLACE_WITH_AWX_VARIABLE_* at deploy time.
# For Docker deployments, use config.yaml instead.

app:
  name: "bytefreezer-receiver"
  version: "1.0.0"

logging:
  level: "info"
  encoding: "console"

server:
  api_port: 8081

protocols:
  webhook:
    enabled: true
    port: 8080
    max_payload_size: 10485760
  upload:
    enabled: false
    max_file_size: 104857600

bytefreezer:
  upload_worker_count: 10
  spool_path: "/var/spool/bytefreezer-receiver"

control_service:
  enabled: true
  control_url: "REPLACE_WITH_AWX_VARIABLE_bytefreezer_control_url"
  api_key: "REPLACE_WITH_AWX_VARIABLE_bytefreezer_api_key"
  account_id: "REPLACE_WITH_AWX_VARIABLE_bytefreezer_account_id"
  timeout_seconds: 30

authentication:
  enabled: false

otel:
  enabled: true
  service_name: "bytefreezer-receiver"
  scrapeIntervalseconds: 15
  prometheus_mode: true
  metrics_port: 9091
  metrics_host: "0.0.0.0"

housekeeping:
  enabled: true
  interval_seconds: 600

s3destination:
  bucket_name: "bytefreezer-intake"
  region: "us-east-1"
  endpoint: "REPLACE_WITH_AWX_VARIABLE_bytefreezer_s3_endpoint"
  ssl: false
  access_key: "REPLACE_WITH_AWX_VARIABLE_bytefreezer_s3_access_key"
  secret_key: "REPLACE_WITH_AWX_VARIABLE_bytefreezer_s3_secret_key"
  use_iam_role: false

soc:
  enabled: false

dlq:
  enabled: true
  directory: "/var/spool/bytefreezer-receiver"
  retry_attempts: 3
  retry_interval_seconds: 60
  cleanup_interval_seconds: 300
  max_age_days: 7

dev: false

health_reporting:
  enabled: true
  report_interval: 30
  timeout_seconds: 10
  register_on_startup: true

error_tracking:
  enabled: true
